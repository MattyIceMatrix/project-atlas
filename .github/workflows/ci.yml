# CI: the atlas data, the rendered pages and the counts the README states must agree
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest
      - run: pytest -q
      - run: python tools/render.py --check
      # schema, phase order, gates, page sections, internal links, upgrade
      # references, README counts and the NATIONSTACK capacity report
      - run: python tools/validate.py
